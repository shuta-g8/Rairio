<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Rairio symbol"><rect width="512" height="512" fill="#fff"/><svg x="32" y="162" width="448" height="188" viewBox="6 10 467 196" fill="none"><defs>
